name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv python install 3.15
      - run: uv sync --locked --python 3.15
      - run: uv run --locked --python 3.15 pytest -q tests
