name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.4
      - run: uv python install 3.15
      - run: uv sync --locked --python 3.15 --group repair-linux --group repair-macos
      - run: uv run --locked --python 3.15 pytest -q -m "not network" tests
      - run: uv run --locked --python 3.15 pytest -q -m network tests/integration/test_uv_resolution.py
